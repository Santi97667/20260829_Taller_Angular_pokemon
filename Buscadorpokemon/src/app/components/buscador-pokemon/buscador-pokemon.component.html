<div>
  <form (ngSubmit)="buscarPokemon()" #buscadorForm="ngForm">
    <div>
      <input
        type="text"
        [ngModel]="nombrePokemonInput()"
        (ngModelChange)="nombrePokemonInput.set($event)"
        name="pokemon"
        placeholder="Ej: Pikachu, Charmander, Bulbasaur"
        required
      />
    </div>
    <div>
      <button type="submit" [disabled]="cargando()">Buscar</button>
    </div>
  </form>
</div>

@if (pokemon(); as p) {
  <div appResaltarTarjeta [colorBorde]="'#0000ff'" class="card-pokemon">
    <h2>{{ p.name }}</h2>
    <img [src]="p.image" [alt]="p.name" />
    <p><strong>Elementos: </strong>{{ p.type }}</p>
    <button type="button" class="btn-guardar" (click)="guardarEnEquipo()">Guardar</button>
  </div>
} @else if (mensajeError()) {
  <p>{{ mensajeError() }}</p>
}
