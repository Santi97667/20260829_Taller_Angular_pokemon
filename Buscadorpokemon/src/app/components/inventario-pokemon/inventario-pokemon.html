<div>
    <h2> la mochila de los pokemon</h2>
    <p> Total en almacen: <strong>{{pokemonService.misPokemons().length}}</strong></p>
</div>

<div class="grid-pokemon">
    @for (poke of pokemonService.misPokemons(); track poke.id; let idx = $index; let total = $count) {
        <div appResaltartarjeta class="item-inventario" [ngClass]="{'favorito-activo': poke.esFavorito}">
            <span class="posicion-badge">#{{idx}} de {{total}}</span>
            <img [src]="poke.image" [alt]="poke.name" />
            <h4>{{ poke.name }}</h4>
            <p>{{ poke.type }}</p>

            <div class="acciones">
                <button (click)="pokemonService.eliminarPokemon(poke.id)">Eliminar liberar pokemon</button>
                <button (click)="pokemonService.marcarFavorito(poke.id)">Marcar Favor marcar pokemon como favorito</button>
            </div>
        </div>
    }
</div>
